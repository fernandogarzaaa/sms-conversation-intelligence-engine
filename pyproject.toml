[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-conversation-intelligence-engine"
version = "0.2.0"
description = "SMS Conversation Intelligence Engine - event-driven conversation intelligence, deterministic policy, human review, and measurable learning for post-job SMS."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fernando Garza" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
sms-engine = "sms_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sms_engine.ui" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: calls a real LLM provider over the network (opt in with SMS_ENGINE_LIVE_TESTS=1)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are allowed in regex tables and SQL
    "B008",   # FastAPI's Depends()/Form() defaults are idiomatic
    "UP007",
    "UP017",  # timezone.utc reads clearer than datetime.UTC here
    "UP042",  # StrEnum would change str() of every enum value (behaviour change)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.coverage.run]
source = ["sms_engine"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

# Configurable automation thresholds live in config/automation.toml
# (see config/automation.example.toml), not here.
