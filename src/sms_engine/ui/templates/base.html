<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}the SMS Engine{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f2430; --ink:#e7e9ee; --muted:#9aa4b2;
    --line:#2a2f3a; --accent:#5b9dff; --good:#3fbf7f; --warn:#e6b450; --bad:#f0726f;
    --pill:#232838;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;gap:20px;align-items:baseline;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-weight:700;letter-spacing:.2px}
  header nav a{margin-right:16px;color:var(--muted)}
  header nav a:hover{color:var(--ink)}
  main{padding:22px;max-width:1180px;margin:0 auto}
  h1{font-size:18px;margin:0 0 14px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .n{font-size:22px;font-weight:700}
  .card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--pill);font-size:12px;border:1px solid var(--line)}
  .pill.good{color:var(--good);border-color:#26543f}
  .pill.warn{color:var(--warn);border-color:#5a4a24}
  .pill.bad{color:var(--bad);border-color:#6b3634}
  .pill.accent{color:var(--accent);border-color:#274063}
  .route-AUTO_REPLY{color:var(--good)} .route-HUMAN_REVIEW{color:var(--warn)}
  .route-SUPPRESS{color:var(--bad)} .route-ESCALATE{color:var(--bad)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .trace{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .thread{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .msg{max-width:74%;padding:8px 12px;border-radius:12px}
  .msg.IN{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg.OUT{align-self:flex-end;background:#1c2c46;border:1px solid #274063}
  .msg .t{font-size:11px;color:var(--muted);margin-top:4px}
  form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=text],textarea,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
  textarea{width:100%;min-height:70px}
  button{background:var(--accent);color:#05203f;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button.bad{background:var(--bad);color:#2a0e0e}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
  .kv div:nth-child(odd){color:var(--muted)}
  .small{color:var(--muted);font-size:12px}
  code{background:var(--panel2);padding:1px 5px;border-radius:5px}
  /* primary action button / link */
  .btn{display:inline-block;background:var(--accent);color:#05203f;border:0;border-radius:8px;
       padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn.bad{background:var(--bad);color:#2a0e0e}
  /* clickable rows: ONLY inside a table explicitly opted in with .rowlink
     (the review queue). Conversation / status tables are never row-clickable. */
  table.rowlink tr[data-href]{cursor:pointer}
  table.rowlink tr[data-href]:hover td{background:var(--panel2)}
  table.rowlink tr[data-href]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  /* status/decision text is never itself a navigation target */
  td[class*="route-"]{cursor:default}
  /* intent pills: wrap, never overlap */
  .pills{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .pills .more{color:var(--muted)}
  /* orientation callout */
  .callout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
    padding:12px 16px;margin:0 0 18px}
  .callout .big{font-size:20px;font-weight:700}
  .callout.none{border-left-color:var(--good)}
  .callout .cta{margin-left:auto}
  /* current nav item — not a link, no trap */
  header nav .navcur{color:var(--ink);font-weight:600;pointer-events:none;cursor:default;
    text-decoration:underline;text-underline-offset:3px}
  /* "already suppressed" state on the conversation page */
  .statebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
    border:1px solid #6b3634;border-left:3px solid var(--bad);border-radius:10px;
    padding:10px 14px;margin:6px 0 10px}
  button[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
</style>
</head>
<body>
<header>
  <span class="brand">the business · SMS Conversation Intelligence</span>
  <nav>
    <a href="/" data-nav="dashboard">Dashboard</a>
    <a href="/ui/inbox" data-nav="inbox">Review inbox</a>
  </nav>
  <span class="small">The model generates language. The system owns decisions, state, safety, and truth.</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
<script>
  // Fix 1: row-click only for tables opted in with .rowlink, and never when the
  // click lands on a status/decision cell (e.g. the literal word "SUPPRESS").
  document.addEventListener('click', function (e) {
    if (e.target.closest('a, button, input, textarea, select, label')) return;
    // status / decision chips and cells are data, never navigation targets
    if (e.target.closest('[class*="route-"], .pill, .pills')) return;
    var tr = e.target.closest('table.rowlink tr[data-href]');
    if (tr) window.location = tr.getAttribute('data-href');
  });
  document.querySelectorAll('table.rowlink tr[data-href]').forEach(function (tr) {
    tr.setAttribute('tabindex', '0');
    tr.setAttribute('role', 'link');
    tr.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.location = tr.getAttribute('data-href');
      }
    });
  });

  // Fix 4: neutralise the nav link for the page you're already on.
  (function () {
    var p = location.pathname;
    var here = p === '/' ? 'dashboard' : (p.indexOf('/ui/inbox') === 0 ? 'inbox' : null);
    if (!here) return;
    var a = document.querySelector('header nav a[data-nav="' + here + '"]');
    if (!a) return;
    a.classList.add('navcur');
    a.setAttribute('aria-current', 'page');
    a.removeAttribute('href');
  })();
</script>
</body>
</html>
