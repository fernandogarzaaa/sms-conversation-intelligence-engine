<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SMS Engine{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f2430; --ink:#e7e9ee; --muted:#9aa4b2;
    --line:#2a2f3a; --accent:#5b9dff; --accent-ink:#05203f; --good:#3fbf7f; --warn:#e6b450; --bad:#f0726f;
    --bad-ink:#2a0e0e; --pill:#232838; --out:#1c2c46; --out-line:#274063;
    --good-line:#26543f; --warn-line:#5a4a24; --bad-line:#6b3634;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --ink:#161a22; --muted:#5b6472;
      --line:#dde1e7; --accent:#1f62d0; --accent-ink:#ffffff; --good:#1d7f4e; --warn:#8a6100; --bad:#c0362f;
      --bad-ink:#ffffff; --pill:#eef1f5; --out:#e6efff; --out-line:#b9cff5;
      --good-line:#a7d9bf; --warn-line:#e6cf94; --bad-line:#efb7b3;
      color-scheme: light;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-weight:700;letter-spacing:.2px}
  header nav{display:flex;gap:16px}
  header nav a{color:var(--muted)}
  header nav a:hover{color:var(--ink)}
  header .meta{margin-left:auto}
  main{padding:22px 16px;max-width:1180px;margin:0 auto}
  h1{font-size:18px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;background:var(--panel)}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--pill);font-size:12px;border:1px solid var(--line);white-space:nowrap}
  .pill.good{color:var(--good);border-color:var(--good-line)}
  .pill.warn{color:var(--warn);border-color:var(--warn-line)}
  .pill.bad{color:var(--bad);border-color:var(--bad-line)}
  .pill.accent{color:var(--accent);border-color:var(--out-line)}
  .route-AUTO_REPLY{color:var(--good)} .route-HUMAN_REVIEW{color:var(--warn)}
  .route-SUPPRESS{color:var(--bad)} .route-ESCALATE{color:var(--bad)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .trace{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
  .thread{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .msg{max-width:80%;padding:8px 12px;border-radius:12px;overflow-wrap:anywhere}
  .msg.IN{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg.OUT{align-self:flex-end;background:var(--out);border:1px solid var(--out-line)}
  .msg.current{outline:2px solid var(--warn);outline-offset:1px}
  .msg .t{font-size:11px;color:var(--muted);margin-top:4px}
  form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{color:var(--muted);font-size:12px}
  input[type=text],textarea,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
  input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
  textarea{width:100%;min-height:90px;resize:vertical}
  button,.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
  button:hover,.btn:hover{filter:brightness(1.08);text-decoration:none}
  button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button.bad,.btn.bad{background:var(--bad);color:var(--bad-ink)}
  button[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
  .two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
  @media (max-width:860px){.two{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 12px}
  .kv > div:nth-child(odd){color:var(--muted)}
  .kv > div{overflow-wrap:anywhere}
  .small{color:var(--muted);font-size:12px}
  code{background:var(--panel2);padding:1px 5px;border-radius:5px}
  table.rowlink tr[data-href]{cursor:pointer}
  table.rowlink tr[data-href]:hover td{background:var(--panel2)}
  table.rowlink tr[data-href]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  td[class*="route-"]{cursor:default}
  .pills{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .pills .more{color:var(--muted)}
  .callout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
    padding:12px 16px;margin:0 0 18px}
  .callout .big{font-size:20px;font-weight:700}
  .callout.none{border-left-color:var(--good)}
  .callout.warn{border-left-color:var(--warn)}
  .callout.bad{border-left-color:var(--bad)}
  .callout .cta{margin-left:auto}
  .callout ul{margin:4px 0 0;padding-left:18px}
  .flash{border-radius:10px;padding:10px 14px;margin:0 0 16px;border:1px solid var(--line);background:var(--panel)}
  .flash.good{border-left:3px solid var(--good)} .flash.bad{border-left:3px solid var(--bad)}
  .flash.info{border-left:3px solid var(--accent)}
  header nav .navcur{color:var(--ink);font-weight:600;pointer-events:none;cursor:default;
    text-decoration:underline;text-underline-offset:3px}
  .statebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--bad-line);border-left:3px solid var(--bad);border-radius:10px;
    padding:10px 14px;margin:6px 0 10px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:10px 0}
  details > summary{cursor:pointer;padding:10px 0;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  details[open] > summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  details > :last-child{margin-bottom:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .findings{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:22px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  footer{max-width:1180px;margin:0 auto;padding:10px 16px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <span class="brand">SMS Conversation Intelligence</span>
  <nav aria-label="Main">
    <a href="/" data-nav="dashboard">Dashboard</a>
    <a href="/ui/inbox" data-nav="inbox">Review inbox</a>
    <a href="/docs" data-nav="api">API</a>
  </nav>
  <span class="small meta">The model writes the text. The system owns the decisions.</span>
</header>
<main>
{% if flash %}<div class="flash {{ flash_kind }}" role="status">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
<footer>v{{ version }} · provider <span class="mono">{{ provider }}</span> · all demo data is synthetic</footer>
<script>
  // Row-click only for tables opted in with .rowlink, and never when the click
  // lands on a control or a status chip.
  document.addEventListener('click', function (e) {
    if (e.target.closest('a, button, input, textarea, select, label, summary')) return;
    if (e.target.closest('[class*="route-"], .pill, .pills')) return;
    var tr = e.target.closest('table.rowlink tr[data-href]');
    if (tr) window.location = tr.getAttribute('data-href');
  });
  document.querySelectorAll('table.rowlink tr[data-href]').forEach(function (tr) {
    tr.setAttribute('tabindex', '0');
    tr.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); window.location = tr.getAttribute('data-href'); }
    });
  });
  // Mark the nav item for the current page.
  (function () {
    var p = location.pathname;
    var here = p === '/' ? 'dashboard' : (p.indexOf('/ui/inbox') === 0 ? 'inbox' : null);
    if (!here) return;
    var a = document.querySelector('header nav a[data-nav="' + here + '"]');
    if (!a) return;
    a.classList.add('navcur');
    a.setAttribute('aria-current', 'page');
    a.removeAttribute('href');
  })();
  // Don't leave ?flash= in the address bar (a reload would repeat the message).
  if (location.search.indexOf('flash=') !== -1 && window.history.replaceState) {
    history.replaceState(null, '', location.pathname);
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
